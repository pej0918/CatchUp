# @package _global_
# CatchUp on Qwen2.5-VL-7B-Instruct (additional backbone).
defaults:
  - /eval: pope
  - /model: qwen25vl_7b
  - _self_

routing:
  method: qver
  action: compact_route
  monotonic: false
  drop_layers: [2, 6, 13, 20]
  keep_ratios: [0.2655, 0.2655, 0.1328, 0.0664]

eval:
  batch_size: 1
  log_samples: true
