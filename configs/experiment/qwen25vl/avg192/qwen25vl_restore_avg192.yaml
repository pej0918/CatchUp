# @package _global_
# CatchUp on Qwen2.5-VL-7B-Instruct (additional backbone).
# Routing layers adapted to Qwen's 28-layer language decoder: [2,6,13,20].
defaults:
  - /eval: pope
  - /model: qwen25vl_7b
  - _self_

routing:
  method: qver
  action: compact_route
  monotonic: false
  drop_layers: [2, 6, 13, 20]
  keep_ratios: [0.4502, 0.4502, 0.2251, 0.1126]

eval:
  batch_size: 1
  log_samples: true
