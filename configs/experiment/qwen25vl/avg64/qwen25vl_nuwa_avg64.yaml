# @package _global_

defaults:
  - /eval: pope
  - /model: qwen25vl_7b
  - _self_

routing:
  method: nuwa
  action: physical_delete

  # Official Qwen-Nüwa 0.25 preset
  stage1_keep_ratio: 0.35
  stage2_keep_ratio: 0.42
  top_n_per_region: 3

  # Common experimental choice: L16
  stage2_layer: 16

  # Official Qwen-Nüwa
  penalty_threshold_percentile: 0.1

eval:
  batch_size: 1
  log_samples: true
