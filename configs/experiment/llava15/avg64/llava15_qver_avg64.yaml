# @package _global_
# CatchUp on LLaVA-1.5-7B (routing budget 64).
# Reversible visual evidence routing + LTC (run via scripts/run_catchup.sh).
# "qver" is the historical implementation identifier, not the paper method name.
defaults:
  - /eval: pope
  - /model: llava15_7b_hf
  - _self_

routing:
  method: qver
  action: compact_route
  monotonic: false
  drop_layers: [2, 7, 15, 23]
  keep_ratios: [0.1392, 0.1392, 0.0696, 0.0348]

eval:
  batch_size: 1
  log_samples: true
