# @package _global_
# LLaVA-1.5-7B + Q-VER @ avg_T = 64.
# Query-guided dynamic visual evidence routing with recoverable active/deferred
# visual tokens. Use REROUTE_CORRECTION_MODE=qver for Query-Relevant LTC.
defaults:
  - /eval: pope
  - /model: llava15_7b_hf
  - _self_

routing:
  method: qver
  action: compact_route
  monotonic: false
  drop_layers: [2, 7, 15, 23]
  keep_ratios: [0.1392, 0.1392, 0.0696, 0.0348]

eval:
  batch_size: 1
  log_samples: true
