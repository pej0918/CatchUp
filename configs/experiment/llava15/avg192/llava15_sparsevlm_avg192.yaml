# @package _global_
# LLaVA-1.5-7B + SparseVLM @ avg_T = 192.
# Official SparseVLM-style layer schedule:
# retain_tokens=192 -> keep_tokens [300, 200, 110] at layers [2, 6, 15].
defaults:
  - /eval: pope
  - /model: llava15_7b_hf
  - _self_

routing:
  method: sparsevlm
  action: physical_delete
  retain_tokens: 192
  use_version: "1_0"
  drop_layers: [2, 6, 15]

eval:
  batch_size: 1
  log_samples: true
